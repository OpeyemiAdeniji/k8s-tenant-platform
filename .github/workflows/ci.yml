name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate tenant files
        run: make validate
      - name: Run contract tests
        run: make test-contract

  chart:
    name: chart
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Lint and render the tenant chart
        run: make chart-test

  isolation:
    name: isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the cluster
        run: make cluster-up
      - name: Apply the tenants
        run: make tenants-apply
      - name: Run the isolation tests
        run: make test-isolation
      - name: Show the cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-tenant-platform get nodes -o wide || true
          kubectl --context kind-tenant-platform get pods -A -o wide || true
          kubectl --context kind-tenant-platform get events -A --sort-by=.lastTimestamp | tail -50 || true
          echo "--- kernel log (shared by all nodes, because they are containers on one host)"
          docker exec tenant-platform-control-plane dmesg 2>&1 | grep -iE 'oom|out of memory|killed process|not permitted|denied' | tail -20 || true

  # Add project-specific jobs here (validate, test, build) as the project grows.
  # Keep the job names stable: branch protection matches required checks by name.
