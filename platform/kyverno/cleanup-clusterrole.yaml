# Lets the Kyverno cleanup controller delete PolicyExceptions, and nothing else.
# Exceptions carry a cleanup.kyverno.io/ttl label with an absolute date, and the cleanup
# controller deletes them when the date passes
# (docs/adr/0008-kyverno-cel-policies-and-expiring-exceptions.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cleanup-policyexceptions
rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["get", "list", "watch", "delete"]
