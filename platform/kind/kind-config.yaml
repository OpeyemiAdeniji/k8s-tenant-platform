# kind cluster for the tenant platform.
# The default network plugin is disabled. Calico is installed by
# scripts/cluster-up.sh (see docs/adr/0003-network-plugin-calico.md).
# The pod range matches the default address pool of Calico.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
