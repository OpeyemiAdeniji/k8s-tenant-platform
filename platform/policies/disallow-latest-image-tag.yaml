apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-image-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest image tag
    policies.kyverno.io/description: >-
      Pods in tenant namespaces must pin every image to a version or a digest. An image
      with the tag latest, or with no tag, can change under a running workload.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: k8s-tenant-platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image) +
        object.spec.?initContainers.orValue([]).map(c, c.image)
    - name: unpinned
      expression: >-
        variables.images.filter(i, !(i.contains('@') ||
        (i.substring(i.lastIndexOf('/') + 1).contains(':') && !i.endsWith(':latest'))))
  validations:
    - expression: "size(variables.unpinned) == 0"
      messageExpression: >-
        'Image ' + variables.unpinned.join(', ') + ' uses the tag latest or has no tag. Fix: pin the image to a version, for example busybox:1.36, or to a digest. Runbook: https://github.com/OpeyemiAdeniji/k8s-tenant-platform/blob/main/docs/runbooks/policy-disallow-latest-tag.md'
